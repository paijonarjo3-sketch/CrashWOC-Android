name: CrashWOC Android Build Check

on:
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          mkdir source
          unzip -q CrashWOC-NuWorld-0.10.0-with-decomp.zip -d source
          SRC="$(dirname "$(find source -maxdepth 3 -name CMakeLists.txt | head -n1)")"
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "Source di: $SRC"

      - name: Patch CMake untuk Android
        run: |
          cat > android_patch.py <<'PYEOF'
          import pathlib, sys
          
          p = pathlib.Path(sys.argv[1]) / "CMakeLists.txt"
          s = p.read_bytes().decode().replace("\r\n", "\n")
          
          def sub(old, new):
              global s
              if old not in s:
                  sys.exit("patch gagal, tidak ketemu: " + old)
              s = s.replace(old, new, 1)
          
          sub("project(crashwoc-nuworld VERSION 0.10.0 LANGUAGES C CXX)\n",
              "project(crashwoc-nuworld VERSION 0.10.0 LANGUAGES C CXX)\n"
              "\n# --- Android ---\n"
              "set(NW_UPD_EXCL \"\")\n"
              "if(ANDROID)\n  set(NW_UPD_EXCL EXCLUDE_FROM_ALL)\nendif()\n"
              "function(nw_add_main name)\n"
              "  if(ANDROID)\n    add_library(${name} SHARED ${ARGN})\n"
              "  else()\n    add_executable(${name} ${ARGN})\n  endif()\n"
              "endfunction()\n# --- end Android ---\n")
          sub("add_executable(crashwoc-nuworld\n", "nw_add_main(crashwoc-nuworld\n")
          sub("set_target_properties(crashwoc-nuworld PROPERTIES OUTPUT_NAME NuWorld)\n",
              "set_target_properties(crashwoc-nuworld PROPERTIES OUTPUT_NAME NuWorld)\n"
              "if(ANDROID)\n  set_target_properties(crashwoc-nuworld PROPERTIES OUTPUT_NAME main)\nendif()\n")
          sub("add_executable(nuworld-updater src/updater/main.cpp",
              "add_executable(nuworld-updater ${NW_UPD_EXCL} src/updater/main.cpp")
          sub("add_dependencies(crashwoc-nuworld nuworld-updater)\n",
              "if(NOT ANDROID)\n  add_dependencies(crashwoc-nuworld nuworld-updater)\nendif()\n")
          p.write_text(s)
          print("CMakeLists.txt dipatch untuk Android")
          PYEOF
          python3 android_patch.py "$SRC"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libclang-dev
          python -m pip install -r "$SRC/tools/requirements.txt"

      - name: Configure (arm64-v8a, NDK)
        run: |
          set -o pipefail
          cmake -S "$SRC" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DNUWORLD_TESTS=OFF \
            2>&1 | tee configure.log

      - name: Build libmain.so
        run: |
          set -o pipefail
          cmake --build build --target crashwoc-nuworld -- -k 0 2>&1 | tee build.log

      - name: Ringkasan error
        if: always()
        run: |
          grep -E "error:|undefined symbol" build.log | sort | uniq -c | sort -rn | head -60 > errors.log || true
          cat errors.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            configure.log
            build.log
            errors.log
            build/libmain.so
          if-no-files-found: ignore
