name: CrashWOC Android Build Check

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          mkdir source
          unzip -q CrashWOC-NuWorld-0.10.0-with-decomp.zip -d source

      - name: Check source
        run: |
          find source -name CMakeLists.txt
          find source -name AndroidManifest.xml
          echo "Inspection completed"
