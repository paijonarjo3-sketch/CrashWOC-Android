name: CrashWOC Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare logs
        run: |
          mkdir -p logs build
          touch logs/extract.log
          touch logs/configure.log
          touch logs/build.log

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="CrashWOC-NuWorld-0.10.0-with-decomp.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan: $ZIP" | tee logs/extract.log
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP" -d source

          SRC="$(find source -maxdepth 5 -name CMakeLists.txt -print -quit)"

          if [ -z "$SRC" ]; then
            echo "ERROR: CMakeLists.txt tidak ditemukan" | tee logs/extract.log
            exit 1
          fi

          SRC="$(dirname "$SRC")"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

          echo "Source: $SRC" | tee logs/extract.log
          find "$SRC" -maxdepth 2 -type f | head -100 >> logs/extract.log

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"
          accept-android-sdk-licenses: true
          packages: ""

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-29" \
            "ndk;27.2.12479018" \
            "cmake;3.31.6"

          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libclang-dev build-essential

      - name: Install Python requirements
        shell: bash
        run: |
          if [ -f "$SRC/tools/requirements.txt" ]; then
            python -m pip install -r "$SRC/tools/requirements.txt"
          else
            echo "Python requirements tidak ditemukan; dilewati."
          fi

      - name: Configure Android build
        shell: bash
        run: |
          set -o pipefail

          cmake -S "$SRC" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            2>&1 | tee logs/configure.log

      - name: Compile
        shell: bash
        run: |
          set -o pipefail

          cmake --build build --parallel 2 \
            2>&1 | tee logs/build.log

      - name: Inspect generated files
        if: always()
        shell: bash
        run: |
          echo "=== APK ==="
          find . -type f -name "*.apk" -print || true

          echo "=== Native libraries ==="
          find build -type f -name "*.so" -print 2>/dev/null || true

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrashWOC-Android-Results
          path: |
            logs/
            build/
          if-no-files-found: warn
          retention-days: 7
