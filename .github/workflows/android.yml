
name: CrashWOC Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="CrashWOC-NuWorld-0.10.0-with-decomp.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP tidak ditemukan: $ZIP"
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP" -d source

          SRC="$(find source -maxdepth 4 -name CMakeLists.txt -print -quit)"

          if [ -z "$SRC" ]; then
            echo "ERROR: CMakeLists.txt tidak ditemukan"
            exit 1
          fi

          SRC="$(dirname "$SRC")"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

          echo "Source directory: $SRC"
          echo "=== Source files ==="
          find "$SRC" -maxdepth 2 -type f | head -100

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-30" \
            "ndk;27.2.12479018" \
            "cmake;3.31.6"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmake/3.31.6/bin" >> "$GITHUB_PATH"

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            clang \
            libclang-dev \
            build-essential \
            unzip

      - name: Install Python requirements
        shell: bash
        run: |
          if [ -f "$SRC/tools/requirements.txt" ]; then
            python -m pip install -r "$SRC/tools/requirements.txt"
          else
            echo "No tools/requirements.txt; skipping."
          fi

      - name: Configure Android build
        shell: bash
        run: |
          set -euo pipefail

          cmake -S "$SRC" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            2>&1 | tee configure.log

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail

          cmake --build build --parallel 2 \
            2>&1 | tee build.log

      - name: Check generated files
        if: always()
        shell: bash
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print || true

          echo "=== Native libraries ==="
          find build -type f -name "*.so" -print 2>/dev/null || true

      - name: Upload build results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrashWOC-Android-Build-Results
          path: |
            configure.log
            build.log
            build/**/*.so
            build/**/*.apk
            build/**/*.aab
          if-no-files-found: warn
          retention-days: 7
